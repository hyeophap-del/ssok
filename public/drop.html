<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>{{APP_NAME}}</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    .drop-page { max-width: 560px; margin: 0 auto; padding: 4px 16px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
    .drop-head h1 { font-size: 22px; letter-spacing: -0.02em; }
    .drop-head p { margin: 6px 0 0; }
    .drop-main { display: grid; gap: 14px; }
    .drop-main .dropzone { display: grid; }
    @media (pointer: coarse) { .drop-main .dropzone { display: none; } }
    @media (pointer: fine) { .drop-main .pick-buttons { display: none; } }
    .pin-card { display: grid; gap: 12px; text-align: center; }
    .pin-card input {
      font: 700 22px ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 0.2em; text-align: center;
      min-height: 52px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    }
    .pin-card input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .pin-error { color: var(--danger); font-size: 14px; margin: 0; }
    .list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
    .list li { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .list .icon { color: var(--muted); }
    .list .sent-icon { color: var(--success); }
    .list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list .text { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 6.5em; overflow: auto; }
    .note { font-size: 12px; color: var(--muted); text-align: center; }
    body.dragging .dropzone { border-color: var(--accent); background: var(--accent-soft); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/icon.svg" alt="" width="30" height="30">
      <span>{{APP_NAME}}</span>
    </div>
    <div id="status" class="status" data-state="connecting" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">연결 중…</span>
    </div>
  </header>

  <main class="drop-page">
    <form id="pin-form" class="card pin-card" hidden>
      <h1 id="pin-title" style="font-size: 20px">비밀번호를 넣어 주세요</h1>
      <p class="muted small" style="margin: 0">링크를 보낸 사람에게 받은 비밀번호예요. 이 브라우저는 다음부터 기억해요.</p>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="20" aria-label="비밀번호" required>
      <p id="pin-error" class="pin-error" hidden></p>
      <button class="btn primary" type="submit">열기</button>
    </form>

    <section id="drop-ready" class="drop-head" hidden>
      <h1 id="drop-title">주고받기</h1>
      <p class="muted small">보낸 파일은 상대 PC에 바로 저장돼요. 내용은 암호화되어 오가고 중계 서버에 저장되지 않아요.</p>
    </section>

    <section id="drop-main" class="card drop-main" hidden>
      <div class="pick-buttons">
        <label class="big-btn primary">
          <input id="pick-media" type="file" accept="image/*,video/*" multiple hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-image"/></svg>
          <span>사진·동영상<br>보내기</span>
        </label>
        <label class="big-btn">
          <input id="pick-file" type="file" multiple hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>
          <span>파일<br>보내기</span>
        </label>
      </div>
      <label class="dropzone">
        <input id="pick-any" type="file" multiple hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>
        <strong>보낼 파일을 여기에 끌어다 놓으세요</strong>
        <span class="muted">클릭해서 고르거나, 캡처한 화면을 Ctrl+V로 붙여 넣어도 돼요</span>
      </label>
      <form id="text-form" class="text-form">
        <textarea id="text-input" rows="1" placeholder="텍스트나 링크" aria-label="보낼 텍스트"></textarea>
        <button class="btn primary" type="submit">보내기</button>
      </form>
    </section>

    <section id="transfer" class="card transfer" hidden>
      <div class="transfer-head">
        <strong id="transfer-title"></strong>
        <button id="transfer-cancel" class="btn ghost small" type="button">취소</button>
      </div>
      <div class="bar"><div id="transfer-bar"></div></div>
      <div id="transfer-detail" class="muted small"></div>
    </section>

    <section id="inbox-card" class="card" hidden>
      <h2 id="inbox-title">받은 것</h2>
      <ul id="inbox" class="list"></ul>
    </section>

    <section id="sent-card" class="card" hidden>
      <h2>보낸 것</h2>
      <ul id="sent" class="list"></ul>
    </section>

    <div id="locked" class="locked" hidden>
      <div class="locked-card">
        <img src="/icon.svg" alt="" width="64" height="64">
        <h1 id="locked-title"></h1>
        <p id="locked-text" class="muted"></p>
      </div>
    </div>

    <p class="note">{{APP_NAME}} 링크 · 이 링크와 비밀번호를 받은 사람만 쓰세요</p>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0-5 5m5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
    </defs>
  </svg>
  <script type="module" src="/drop.js"></script>
</body>
</html>
